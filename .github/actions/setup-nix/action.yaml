name: "Setup Nix"
description: "Install Nix and configure Cachix"
inputs:
  cachix-auth-token:
    description: "Cachix authentication token"
    required: false
runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ github.token }}

    - name: Setup Cachix (ryoppippi)
      uses: cachix/cachix-action@0fc020193b5a1fa3ac4575aa3a7d3aa6a35435ad # v16
      with:
        name: ryoppippi
        authToken: ${{ inputs.cachix-auth-token }}
        # nix-community ships bun2nix, which update.nu would otherwise build
        # from source on every run
        extraPullNames: nix-community

    - name: Cache Nix store
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
